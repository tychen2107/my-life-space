<script type="module">
import { connectCloud } from "./cloud.js";
'use strict';
const labels={buy:'買入',sell:'賣出',div:'現金股息',opening:'期初持股',rec:'定期定額',odd:'單筆零股',lot:'單筆整張'};
const blank=()=>({accounts:[],trades:[],plans:[],quotes:{},closed:[],goal:30000});
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()??Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmt=(v,d=0)=>v==null?'—':v.toLocaleString('zh-TW',{maximumFractionDigits:d});
const cash=v=>v==null?'—':'NT$ '+fmt(v,2);
const colored=v=>'<span class="'+(v>0?'up':v<0?'down':'')+'">'+(v>0?'+':'')+cash(v)+'</span>';
function roc(value){
  const match=String(value).trim().match(/^(\d{1,3})[/-]?(\d{2})[/-]?(\d{2})$/);
  if(!match)throw Error('請輸入民國日期，例如 115/11/27。');
  const [,y,m,d]=match, year=Number(y)+1911;
  const stamp=new Date(Date.UTC(year,Number(m)-1,Number(d)));
  if(Number(y)<1||stamp.getUTCFullYear()!==year||stamp.getUTCMonth()+1!==Number(m)||stamp.getUTCDate()!==Number(d))throw Error('請確認民國日期是否正確。');
  return y.padStart(3,'0')+'/'+m+'/'+d;
}
function today(){
  const parts=new Intl.DateTimeFormat('en',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts();
  const get=k=>parts.find(p=>p.type===k).value;
  return roc((Number(get('year'))-1911)+'/'+get('month')+'/'+get('day'));
}
function fee(account,mode,amount){
  return Math.max(account[mode],Math.round(amount*(account[mode+'Rate']??account.rate)/100));
}
function estimate(plan,account,price){
  if(!(price>0))return null;
  let low=0,high=Math.floor(plan.budget/price);
  while(low<high){
    const shares=Math.ceil((low+high)/2), amount=Math.round(shares*price*100)/100;
    const cost=amount+(plan.include==='yes'?fee(account,'rec',amount):0);
    if(cost<=plan.budget)low=shares;
    else high=shares-1;
  }
  return low;
}
function positions(trades){
  const rows=new Map();
  for(const tx of trades.slice().sort((a,b)=>a.date.localeCompare(b.date))){
    const id=tx.account+'|'+tx.code;
    if(!rows.has(id))rows.set(id,{account:tx.account,code:tx.code,name:tx.name,shares:0,cost:0,tradeCost:0,hasOpening:false,lots:[],basis:0,realized:0,div:0});
    const p=rows.get(id);
    if(tx.name)p.name=tx.name;
    if(tx.type==='div'){p.div+=tx.amount;continue}
    if(tx.type==='sell'){
      if(tx.shares>p.shares)throw Error(tx.date+' 的 '+tx.code+' 賣出股數超過當時持股。');
      const cost=p.cost*tx.shares/p.shares;
      const remainingFraction=(p.shares-tx.shares)/p.shares;
      p.tradeCost*=remainingFraction;
      p.shares-=tx.shares;
      if(!p.shares)p.hasOpening=false;
      let remaining=tx.shares;
      while(remaining>0){
        const used=Math.min(remaining,p.lots[0]);
        p.lots[0]-=used;
        remaining-=used;
        if(!p.lots[0])p.lots.shift();
      }
      p.cost=p.shares?p.cost-cost:0;
      p.realized+=tx.amount-tx.fee-tx.tax-cost;
    }else{
      p.shares+=tx.shares;
      p.lots.push(tx.shares);
      if(tx.type==='opening')p.hasOpening=true;
      else p.tradeCost+=tx.amount;
      p.cost+=tx.amount+tx.fee;
      p.basis+=tx.amount+tx.fee;
    }
  }
  return [...rows.values()];
}
let state=blank(), cloud, session=null, revision=0, hydrated=false, busy=false;
let tab='總覽',month=today().slice(0,6),filter='',handler,stopSync;
const publicKey='stock-journal-public-market-v2';
let market={names:{'0050':'元大台灣50','0056':'元大高股息'},quotes:{}};
try{
  const cached=JSON.parse(localStorage.getItem(publicKey));
  if(cached)market={names:{...market.names,...cached.names},quotes:cached.quotes??{}};
}catch{}
function status(s){$('#status').textContent=s}
async function save(next){
  if(!session||!hydrated)throw Error('請先登入並等候雲端資料載入。');
  if(busy)throw Error('上一筆資料正在儲存，請稍候。');
  busy=true;
  const uid=session.uid;
  try{
    const record=await cloud.write(uid,revision,JSON.parse(JSON.stringify(next)));
    if(session?.uid===uid&&record.revision>=revision){
      revision=record.revision;state=record.data;render();
    }
  }finally{busy=false}
}
const account=id=>state.accounts.find(a=>a.id===id);
const select=(name,label,options,value)=>'<label>'+label+'<select name="'+name+'" required>'+options.map(([id,text])=>'<option value="'+esc(id)+'" '+(id===value?'selected':'')+'>'+esc(text)+'</option>').join('')+'</select></label>';
const input=(name,label,value='',type='text',attrs='required')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+attrs+'></label>';
const accounts=()=>state.accounts.map(a=>[a.id,a.name]);
const btn=(text,action,id='',extra='')=>'<button data-action="'+action+'" data-id="'+esc(id)+'" '+extra+'>'+text+'</button>';
function modal(title,fields,onSave){
  $('#title').textContent=title;$('#fields').innerHTML=fields;$('#error').textContent='';handler=onSave;
  if(!$('dialog').open)$('dialog').showModal();
}
$('#close').onclick=()=>$('dialog').close();
$('form').onsubmit=async e=>{
  e.preventDefault();
  const submit=e.currentTarget.querySelector('button.primary');
  if(submit.disabled)return;
  submit.disabled=true;
  $('#error').textContent='';
  try{await handler(Object.fromEntries(new FormData(e.currentTarget)));$('dialog').close()}
  catch(err){$('#error').textContent=err.message}
  finally{submit.disabled=false}
};
function editAccount(id,first=false){
  const a=account(id)??{rate:.1425,rec:1,odd:1,lot:20};
  modal(first?'建立第一個券商帳戶':'券商帳戶',input('name','帳戶名稱',a.name??'')+
    input('rate','預設手續費率（%）',a.rate,'number','required min="0" max="100" step="any"')+
    ['rec','odd','lot'].map(m=>'<div class="grid">'+input(m,labels[m]+'最低費（元）',a[m],'number','required min="0" step="1"')+
    input(m+'Rate','個別費率（% · 選填）',a[m+'Rate']??'','number','min="0" max="100" step="any" placeholder="沿用帳戶費率"')+'</div>').join(''),
    data=>{
      if(!data.name.trim())throw Error('請輸入帳戶名稱。');
      const item={id:id||uid(),name:data.name.trim(),rate:Number(data.rate)};
      for(const m of ['rec','odd','lot']){
        item[m]=Number(data[m]);
        if(data[m+'Rate']!=='')item[m+'Rate']=Number(data[m+'Rate']);
      }
      return save({...state,accounts:id?state.accounts.map(old=>old.id===id?item:old):[...state.accounts,item]});
    });
}
const codeOf=s=>{const v=String(s??'').trim().toUpperCase();if(!/^[0-9]{4,6}[A-Z]{0,2}$/.test(v))throw Error('請輸入正確的台股或 ETF 代號。');return v};
function securityName(code){
  return market.names[code]||state.trades.find(t=>t.code===code&&t.name)?.name||
    state.plans.find(p=>p.code===code&&p.name)?.name||'';
}
function wireSecurityFields(){
  const {code,name}=$('form').elements;
  let generated='';
  function update(){
    const found=securityName(code.value.trim().toUpperCase());
    if(name.value===''||name.value===generated){name.value=found;generated=found}
  }
  code.addEventListener('input',()=>{name.value='';generated='';update()});
  code.addEventListener('market-ready',update);
  update();
}
function editTx(id='',draft={}){
  if(!state.accounts.length){editAccount('',true);return}
  const original=state.trades.find(t=>t.id===id);
  const tx=original??draft;
  const num=(n,l,v='',attrs='required min="0" step=".01"')=>input(n,l,v,'number',attrs);
  modal(original?'修改交易':'新增交易',
    select('type','交易類型',[['buy','買入'],['sell','賣出'],['div','現金股息'],['opening','期初持股']],tx.type??'buy')+
    '<div class="grid">'+select('account','券商帳戶',accounts(),tx.account)+input('date','日期（民國年）',tx.date??today(),'text','required inputmode="numeric" placeholder="115/11/27"')+
    input('code','股票代號',tx.code??'')+input('name','股票名稱（選填）',tx.name??'','text','')+
    select('mode','成交方式',['rec','odd','lot'].map(m=>[m,labels[m]]),tx.mode??'odd')+
    num('shares','實際股數',tx.shares??'','required min="1" step="1"')+
    num('amount','成交金額',tx.amount??'','required min=".01" step=".01"')+
    num('fee','券商手續費',original?.fee??'')+num('tax','證交稅',tx.tax??0)+'</div>'+
    '<small id="feeHint"></small>'+input('note','備註（選填）',tx.note??'','text',''),
    data=>{
      const date=roc(data.date);
      if(date>today())throw Error('成交或入帳日不可晚於今天。');
      const trade={id:id||uid(),type:data.type,account:data.account,code:codeOf(data.code),name:data.name.trim()||securityName(codeOf(data.code)),date,
        mode:data.mode,shares:Number(data.shares||0),amount:Number(data.amount),fee:Number(data.fee||0),tax:Number(data.tax||0),
        note:data.note.trim(),planKey:tx.planKey};
      if(trade.type==='div'){trade.shares=0;trade.fee=0}
      if(trade.type==='opening')trade.fee=0;
      if(trade.type!=='sell')trade.tax=0;
      if(trade.type==='sell'&&trade.fee+trade.tax>trade.amount)throw Error('手續費與證交稅合計超過成交金額。');
      const trades=id?state.trades.map(t=>t.id===id?trade:t):[...state.trades,trade];
      const rows=positions(trades);
      const opened=new Set(rows.filter(p=>p.shares>0).map(p=>p.account+'|'+p.code));
      return save({...state,trades,closed:state.closed.filter(key=>!opened.has(key))});
    });
  const f=$('form').elements;
  let custom=Boolean(original);
  function sync(){
    const type=f.type.value, stocks=type!=='div', trade=['buy','sell'].includes(type);
    for(const [name,show] of Object.entries({mode:trade,shares:stocks,fee:trade,tax:type==='sell'})){
      f[name].disabled=!show;f[name].closest('label').hidden=!show;
    }
    f.amount.closest('label').firstChild.textContent=type==='div'?'實際入帳金額':type==='opening'?'持有總成本（含費用）':'成交金額（未含費稅）';
    f.mode.querySelector('[value=rec]').disabled=type==='sell';
    if(type==='sell'&&f.mode.value==='rec')f.mode.value='odd';
    if(trade&&!custom&&account(f.account.value))f.fee.value=f.amount.value?fee(account(f.account.value),f.mode.value,Number(f.amount.value)):'';
    $('#feeHint').textContent=trade?'手續費依帳戶試算，可改成券商實扣金額。':'';
  }
  f.fee.oninput=()=>{custom=true};
  for(const n of ['amount','type','mode','account'])f[n].oninput=sync;
  sync();
  wireSecurityFields();
}
function editPlan(id=''){
  if(!state.accounts.length){editAccount('',true);return}
  const p=state.plans.find(x=>x.id===id)??{};
  modal('定期定額計畫',select('account','券商帳戶',accounts(),p.account)+
    '<div class="grid">'+input('code','股票代號',p.code??'')+input('name','股票名稱（選填）',p.name??'','text','')+
    input('day','每月預計扣款日',p.day??15,'number','required min="1" max="31" step="1"')+
    input('budget','每月預算（元）',p.budget??3000,'number','required min="1" step="1"')+'</div>'+
    select('include','預算是否包含手續費',[['yes','含手續費'],['no','手續費另計']],p.include)+
    select('active','計畫狀態',[['yes','進行中'],['no','暫停']],p.active),
    data=>{
      const plan={...data,code:codeOf(data.code),name:data.name.trim()||securityName(codeOf(data.code)),id:id||uid(),budget:Number(data.budget),day:Number(data.day)};
      return save({...state,plans:id?state.plans.map(x=>x.id===id?plan:x):[...state.plans,plan]});
    });
  wireSecurityFields();
}
function monthControls(){
  return '<div class="row">'+btn('‹ 上月','month','-1')+'<strong>民國 '+month+'</strong>'+btn('下月 ›','month','1')+'</div>';
}
function moveMonth(delta){
  const [y,m]=month.split('/').map(Number);
  const d=new Date(Date.UTC(y+1911,m-1+delta,1));
  month=roc((d.getUTCFullYear()-1911)+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/01').slice(0,6);
  render();
}
function planDate(p){
  const [y,m]=month.split('/').map(Number);
  const last=new Date(Date.UTC(y+1911,m,0)).getUTCDate();
  return month+'/'+String(Math.min(p.day,last)).padStart(2,'0');
}
const quote=code=>{
  const manual=state.quotes[code], official=market.quotes[code];
  return manual&&(!official||manual.date>=official.date)?manual:official;
};
function brokerEstimate(p,q){
  if(!p.shares)return {value:0,fee:0,tax:0};
  const broker=account(p.account);
  if(!q||!broker)return null;
  const taxPerThousand=/^[1-9][0-9]{3}$/.test(p.code)?3:
    /^00[0-9]{2,4}A?$/.test(p.code)?1:null;
  const priceInCents=Math.round(q.price*100);
  const result={value:0,fee:0,tax:taxPerThousand===null?null:0};
  // The broker report estimates each remaining purchase lot separately.
  // Preserve the account setting and interpret the imported 台企 decimal fraction for estimates only.
  const baseRate=broker.name==='台企'&&broker.rate===0.0005?0.05:broker.rate;
  for(const shares of p.lots){
    const value=Math.floor(priceInCents*shares/100);
    const mode=shares%1000===0?'lot':'odd';
    const rate=broker[mode+'Rate']??baseRate;
    result.value+=value;
    result.fee+=Math.max(broker[mode],Math.floor(value*rate/100+1e-9));
    if(taxPerThousand!==null)result.tax+=Math.floor(value*taxPerThousand/1000);
  }
  return result;
}
function metrics(rows){
  const t={value:0,realized:0,unrealized:0,div:0,basis:0,cost:0,fee:0,tax:0};
  let missingQuote=false, missingTax=false;
  for(const p of rows){
    const e=brokerEstimate(p,quote(p.code));
    if(!e)missingQuote=true;
    else{
      t.value+=e.value;
      t.fee+=e.fee;
      if(e.tax===null)missingTax=true;
      else{
        t.tax+=e.tax;
        t.unrealized+=e.value-e.fee-e.tax-p.cost;
      }
    }
    t.cost+=p.cost;t.realized+=p.realized;t.div+=p.div;t.basis+=p.basis;
  }
  if(missingQuote){t.value=null;t.fee=null}
  if(missingQuote||missingTax){t.tax=null;t.unrealized=null}
  t.total=t.unrealized===null?null:t.realized+t.unrealized+t.div;
  t.rate=t.total===null||!t.basis?null:t.total/t.basis*100;
  return t;
}
const amountCell=(label,value)=>'<div><small>'+label+'</small><div>'+value+'</div></div>';
const twoDecimals=new Intl.NumberFormat('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
function holdingCard(p,closed){
  const q=quote(p.code), s=metrics([p]), id=p.account+'|'+p.code;
  return '<article><div class="row"><span class="stock">'+esc(p.code+' '+(p.name||securityName(p.code)))+
    ' <span>'+esc(account(p.account)?.name)+'</span></span>'+btn('明細','detail',id)+'</div><div class="grid">'+
    amountCell('持有股數',fmt(p.shares)+' 股')+
    amountCell('成交均價',p.shares&&!p.hasOpening?twoDecimals.format(p.tradeCost/p.shares):'—')+
    amountCell('投資成本（含買入手續費）',cash(s.cost))+

    '</section><section class="card"><div class="row"><h2 class="brush blue">持股總覽</h2>'+btn('更新股價','refresh')+'</div>'+

}

let tradeMode='';
let previousTradeView='';
function render(){
  const tradeView=JSON.stringify([session?.uid,tab,filter,tradeMode]);
  const scrollTop=tradeView===previousTradeView?$('#tradeList')?.scrollTop??0:0;
  previousTradeView=tradeView;
  $('nav').innerHTML=['總覽','交易','定期定額','設定'].map(x=>btn(x,'tab',x,'aria-current="'+(tab===x)+'"')).join('');
  $('#page').innerHTML=tab==='總覽'?overview():tab==='交易'?history():tab==='定期定額'?plans():settings();
  const tradeList=$('#tradeList');
  if(tradeList)tradeList.scrollTop=scrollTop;
  const mode=$('[name=tradeMode]');
  if(mode)mode.onchange=()=>{tradeMode=mode.value;render()};
}
function editQuote(code){
  const q=quote(code);
  modal(code+' 手動股價',input('price','每股價格',q?.price??'','number','required min=".01" step=".01"')+
    input('date','行情日期（民國年）',q?.date??today()),d=>{
      const date=roc(d.date);
      if(date>today())throw Error('行情日期不可晚於今天。');
      return save({...state,quotes:{...state.quotes,[code]:{price:Number(d.price),date,name:q?.name??''}}});
    });
}
function marketDate(value){
  const digits=String(value??'').replace(/\D/g,'');
  if(digits.length===8)return roc((Number(digits.slice(0,4))-1911)+digits.slice(4));
  return roc(digits);
}
let fetching=false;
async function refresh(){
  if(fetching)return;
  fetching=true;status('更新收盤行情中…');
  const urls=['https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL','https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes'];
  try{
    const results=await Promise.allSettled(urls.map(async url=>{
      const response=await fetch(url,{signal:AbortSignal.timeout(12000)});
      if(!response.ok)throw Error('行情服務暫時無法使用');
      const rows=await response.json();
      if(!Array.isArray(rows))throw Error('行情格式有誤');
      return rows;
    }));
    const quotes={...market.quotes}, names={...market.names};
    const found=new Set();
    for(const result of results){
      if(result.status!=='fulfilled')continue;
      for(const row of result.value){
        const code=String(row.Code??row.SecuritiesCompanyCode??row.SecuritiesCode??'').trim();
        if(!/^[0-9]{4,6}[A-Z]{0,2}$/.test(code))continue;
        const name=String(row.Name??row.CompanyName??row.SecuritiesCompanyName??'').trim();
        if(name)names[code]=name;
        const price=Number(String(row.ClosingPrice??row.Close??'').replaceAll(',',''));
        if(!(price>0&&Number.isFinite(price)))continue;
        let date;
        try{date=marketDate(row.Date??row.TradeDate)}catch{continue}
        if(date>today())continue;
        found.add(code);
        if(!quotes[code]||date>=quotes[code].date)quotes[code]={price,date,name};
      }
    }
    market={names,quotes};
    try{localStorage.setItem(publicKey,JSON.stringify(market))}catch{}
    if(hydrated)render();
    if($('dialog').open)$('form').elements.code?.dispatchEvent(new Event('market-ready'));
    status(found.size?'已更新 '+fmt(found.size)+' 檔收盤行情。':'未取得最新行情，沿用已下載的資料。');
  }catch(err){status(err.message)}
  finally{fetching=false}
}
function download(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download='股票手帳_資料備份_'+today().replaceAll('/','')+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function validBackup(data){
  const goodNumber=(value,min=0)=>Number.isFinite(value)&&value>=min;
  const goodId=id=>typeof id==='string'&&/^[\w-]+$/.test(id);
  const unique=rows=>new Set(rows.map(r=>r.id)).size===rows.length&&rows.every(r=>goodId(r.id));
  if(!data||!Array.isArray(data.accounts)||!Array.isArray(data.trades)||!Array.isArray(data.plans)||!data.quotes||
     Array.isArray(data.quotes)||typeof data.quotes!=='object'||!goodNumber(data.goal,1)||!unique(data.accounts)||!unique(data.trades)||!unique(data.plans))throw Error('備份格式有誤。');
  const ids=new Set(data.accounts.map(a=>a.id));
  for(const a of data.accounts){
    if(typeof a.name!=='string'||!a.name.trim()||!goodNumber(a.rate)||a.rate>100)throw Error('備份的券商設定有誤。');
    for(const m of ['rec','odd','lot'])if(!Number.isSafeInteger(a[m])||a[m]<0||
      (a[m+'Rate']!==undefined&&(!goodNumber(a[m+'Rate'])||a[m+'Rate']>100)))throw Error('備份的手續費設定有誤。');
  }
  for(const t of data.trades){
    if(!ids.has(t.account)||!['buy','sell','div','opening'].includes(t.type)||!['rec','odd','lot'].includes(t.mode)||
      !goodNumber(t.amount,.01)||!goodNumber(t.fee)||!goodNumber(t.tax)||!Number.isSafeInteger(t.shares)||t.shares<(t.type==='div'?0:1))throw Error('備份的交易資料有誤。');
    t.code=codeOf(t.code);t.date=roc(t.date);
  }
  for(const p of data.plans){
    if(!ids.has(p.account)||!Number.isInteger(p.day)||p.day<1||p.day>31||!goodNumber(p.budget,1)||
      !['yes','no'].includes(p.active)||!['yes','no'].includes(p.include))throw Error('備份的定期定額資料有誤。');
    p.code=codeOf(p.code);
  }
  for(const [code,q] of Object.entries(data.quotes)){
    if(code!==codeOf(code)||!goodNumber(q.price,.01))throw Error('備份的行情資料有誤。');
    q.date=roc(q.date);
  }
  const ended=new Set(positions(data.trades).filter(p=>!p.shares).map(p=>p.account+'|'+p.code));
  data.closed=Array.isArray(data.closed)?[...new Set(data.closed.filter(id=>ended.has(id)))]:[];

}
function restore(){
  const chooser=document.createElement('input');
  chooser.type='file';chooser.accept='.json,application/json';
  chooser.onchange=async()=>{
    try{
      if(!chooser.files[0])return;
      const next=JSON.parse(await chooser.files[0].text());
      validBackup(next);
      if(confirm('匯入會取代目前 Google 帳戶的雲端手帳資料。確定匯入嗎？')){
        await save(next);status('備份已匯入。');
      }
    }catch(err){status('匯入失敗，請確認是有效的股票手帳備份。')}
  };
  chooser.click();
}
$('#newTx').onclick=()=>editTx();
document.querySelector('main').addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');
  if(!button)return;
  const {action,id}=button.dataset;
  try{
    switch(action){
      case 'tab':tab=id;filter='';status('');render();break;
      case 'month':moveMonth(Number(id));break;
      case 'detail':tab='交易';filter=id;tradeMode='';render();break;
      case 'clear':filter='';render();break;
      case 'newAccount':editAccount();break;
      case 'editAccount':editAccount(id);break;
      case 'newPlan':editPlan();break;
      case 'editPlan':editPlan(id);break;
      case 'editTx':editTx(id);break;
      case 'deleteTx':{
        if(!confirm('確定刪除這筆交易？'))break;
        const trades=state.trades.filter(t=>t.id!==id);
        const rows=positions(trades);
        const ended=new Set(rows.filter(p=>!p.shares).map(p=>p.account+'|'+p.code));
        await save({...state,trades,closed:state.closed.filter(key=>ended.has(key))});break;
      }
      case 'confirmPlan':{
        const p=state.plans.find(x=>x.id===id), planKey=id+'|'+month, date=planDate(p);
        if(state.trades.some(t=>t.planKey===planKey)||date>today()||p.active!=='yes')break;
        editTx('',{account:p.account,code:p.code,name:p.name,date,mode:'rec',planKey,note:'預計扣款 '+cash(p.budget)});break;
      }
      case 'archive':{
        const p=positions(state.trades).find(p=>p.account+'|'+p.code===id);
        if(p&&!p.shares&&!state.closed.includes(id))await save({...state,closed:[...state.closed,id]});
        break;
      }
      case 'reopen':await save({...state,closed:state.closed.filter(key=>key!==id)});break;
      case 'removeStock':{
        const [accountId,code]=id.split('|');
        const belongs=x=>x.account===accountId&&x.code===code;
        const trades=state.trades.filter(belongs).length, plans=state.plans.filter(belongs).length;
        if(!confirm('永久刪除 '+account(accountId)?.name+' 的 '+code+'？將刪除 '+trades+' 筆交易與 '+plans+' 個定期定額計畫。已實現損益和股息統計也會重新計算。'))break;
        await save({...state,trades:state.trades.filter(x=>!belongs(x)),plans:state.plans.filter(x=>!belongs(x)),
          closed:state.closed.filter(key=>key!==id)});break;
      }
      case 'quote':editQuote(id);break;
      case 'refresh':refresh();break;
      case 'goal':modal('月股息目標',input('goal','目標金額（元）',state.goal,'number','required min="1" step="1"'),
        d=>save({...state,goal:Number(d.goal)}));break;
      case 'backup':download();break;
      case 'restore':restore();break;
    }
  }catch(err){status(err.message)}
});
const authButton=$('#authButton');
const sessionMessage=$('#sessionMessage');
let epoch=0;
function subscribe(user){
  const token=++epoch;
  stopSync?.();
  $('dialog').close();
  session=user;hydrated=false;revision=0;state=blank();
  $('#workspace').hidden=true;$('#page').replaceChildren();
  authButton.hidden=false;
  authButton.textContent=user?'登出':'使用 Google 登入';
  $('#sessionLabel').textContent=user?(user.displayName||user.email||'Google 帳戶'):'股股有錢途';
  sessionMessage.textContent=user?'載入雲端資料…':'登入後可在手機與電腦同步記帳。';
  if(!user)return;
  stopSync=cloud.watch(user.uid,record=>{
    if(token!==epoch||record.revision<revision)return;
    state={...blank(),...record.data};revision=record.revision;
    if(!hydrated){
      hydrated=true;tab='總覽';filter='';tradeMode='';month=today().slice(0,6);
      $('#workspace').hidden=false;
      if(!state.accounts.length)editAccount('',true);
      refresh();
    }
    sessionMessage.textContent='';
    render();
  },error=>{
    if(token===epoch)sessionMessage.textContent='無法讀取雲端資料。請檢查 Firestore 和權限設定。 '+(error.code??'');
  });
}
try{
  cloud=await connectCloud();
  authButton.onclick=async()=>{
    authButton.disabled=true;
    try{if(session)await cloud.logout();else await cloud.login()}
    catch(error){sessionMessage.textContent='Google 帳戶操作失敗。 '+(error.code??error.message)}
    finally{authButton.disabled=false}
  };
  cloud.observe(subscribe);
}catch(error){
  $('#sessionLabel').textContent='股股有錢途';
  sessionMessage.textContent=error.message;
}
